<!doctype html>
<html lang="en">
<head>
  <title>Альфа-селлер</title>
  <meta name="description" content="Альфа-селлер">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <div class="offer">
    <h1>Альфа-Селлер</h1>
    <h2>Единая платформа<br/> управления<br/> онлайн-бизнесом</h2>
    <p>Запустите продажи онлайн с готовыми инструментами для бизнеса.</p>

    <div class="buttons">
      <button class="button" id="create-market-button">Создать магазин</button>
      <button class="button">Отправить заявку</button>
    </div>
  </div>

  <div class="bg-card _left">
    <img src="./assets/imgs/left-bg.png" alt="">
  </div>

  <div class="bg-card _right">
    <img src="./assets/imgs/right-bg.png" alt="">
    <div class="border"></div>
  </div>

<!--  <picture class="human _woman">-->
<!--    <source srcset="./assets/imgs/woman-mobile.png" media="(width <= 393px)">-->
<!--    <img src="./assets/imgs/woman.png" alt="" />-->
<!--  </picture>-->

  <picture class="human _man">
    <source srcset="./assets/imgs/man-mobile.png" media="(width <= 393px)">
    <img src="./assets/imgs/man.png" alt="" />
  </picture>

  <div id="modal" class="modal">
    <div class="backdrop"></div>

    <div class="content">
      <div class="modal-title">Регистрация</div>

      <button class="close-button">
        <img src="./assets/imgs/cross.svg" alt="">
      </button>

      <form class="form">
        <input type="text" placeholder="ФИО" class="input">
        <input type="email" placeholder="Е-mail" class="input">
        <input type="tel" placeholder="Телефон" class="input">

        <label class="checkbox">
          <input type="checkbox">
          <span class="label">Даю согласие на обработку<br/> персональных данных</span>
        </label>

        <button type="submit" class="button">Зарегистрироваться</button>
      </form>

      <div class="social-auth">
        <p class="title">Войти через</p>

        <div class="social">
          <div class="item"><img src="./assets/imgs/social/vk.svg" /></div>
          <div class="item"><img src="./assets/imgs/social/ok.svg" /></div>
          <div class="item"><img src="./assets/imgs/social/ya.svg" /></div>
          <div class="item"><img src="./assets/imgs/social/email.svg" /></div>
        </div>

        <a href="#" class="has-account">Уже есть аккаунт?<br/> Войти</a>
      </div>
    </div>
  </div>

  <script defer src="assets/index.js"></script>
</body>
</html>
